<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="gradBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#064e3b" />
    </linearGradient>
    <linearGradient id="gradGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="50%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background rounded rect -->
  <rect width="512" height="512" rx="110" fill="url(#gradBg)" />
  
  <!-- Subtle border -->
  <rect x="8" y="8" width="496" height="496" rx="102" fill="none" stroke="rgba(52, 211, 153, 0.25)" stroke-width="4" />

  <!-- Growing Steps / Spiritual Crescent & Sprout symbol -->
  <g transform="translate(256, 256)">
    <!-- Crescent Moon of Peace -->
    <path d="M -20,-110 A 110,110 0 1 0 110,20 A 90,90 0 1 1 -20,-110 Z" fill="url(#gradGold)" filter="url(#glow)" opacity="0.9" />
    
    <!-- Central Step Pillars / Growth bars -->
    <rect x="-85" y="50" width="30" height="45" rx="8" fill="#34d399" opacity="0.7" />
    <rect x="-40" y="20" width="30" height="75" rx="8" fill="#34d399" opacity="0.85" />
    <rect x="5" y="-15" width="30" height="110" rx="8" fill="#10b981" />
    <rect x="50" y="-55" width="30" height="150" rx="8" fill="#059669" />

    <!-- Spark / Star on Top Right Step -->
    <polygon points="65,-95 72,-80 88,-80 75,-70 80,-55 65,-65 50,-55 55,-70 42,-80 58,-80" fill="#fef08a" filter="url(#glow)" />
  </g>

  <!-- Subtitle Text inside Icon -->
  <text x="256" y="445" font-family="'Cairo', sans-serif" font-size="34" font-weight="bold" fill="#f8fafc" text-anchor="middle" letter-spacing="2">خُطـوة</text>
</svg>
